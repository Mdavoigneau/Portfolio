<!doctype html>
<!-- Source of public/og.png (1200x630). Render with Playwright's headless shell:
     chrome-headless-shell --headless --hide-scrollbars --window-size=1200,630 --force-device-scale-factor=1 --virtual-time-budget=8000 --screenshot=public/og.png file://$PWD/design/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #fdfdfc; --ink: #0c0c09; --ink-3: #72725b; --brand: #00786f; --brand-600: #00665e;
    --brand-700: #004f49; --brand-deep: #28463a; --mint: #e1f7d2; --sunken: #f4f4f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--paper); color: var(--ink); font-family: Figtree, sans-serif; }
  .blob-a { position: absolute; left: -140px; top: -160px; width: 560px; height: 560px; border-radius: 50%; background: rgba(225, 247, 210, .75); filter: blur(70px); }
  .blob-b { position: absolute; right: -80px; top: 60px; width: 460px; height: 460px; border-radius: 50%; background: rgba(0, 120, 111, .08); filter: blur(70px); }
  .dots { position: absolute; inset: 0; opacity: .06; background-image: radial-gradient(circle at 1px 1px, var(--ink) 1px, transparent 0); background-size: 18px 18px; }
  .frame { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .id { display: flex; align-items: center; gap: 18px; }
  .badge { width: 56px; height: 56px; border-radius: 12px; background: var(--brand-deep); color: var(--mint); display: grid; place-items: center; font: italic 500 30px/1 Fraunces, serif; }
  .mono { font-family: "Geist Mono", monospace; font-size: 18px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
  .domain { font-family: "Geist Mono", monospace; font-size: 20px; font-weight: 500; color: var(--brand-600); }
  h1 { margin-top: 64px; max-width: 900px; font: 500 84px/1.04 Fraunces, serif; letter-spacing: -0.008em; font-variation-settings: "opsz" 144; }
  .swash { position: relative; display: inline-block; font-style: italic; color: var(--brand-700); }
  .swash i { position: absolute; left: -0.08em; right: -0.08em; bottom: 0.06em; height: 0.42em; background: var(--mint); z-index: -1; border-radius: 3px; }
  .foot { margin-top: auto; }
  .bars { position: absolute; right: 80px; bottom: 74px; width: 250px; display: grid; gap: 13px; }
  .bar { height: 12px; border-radius: 999px; background: var(--sunken); position: relative; }
  .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--brand); opacity: .85; }
  .bar span.est { background: var(--brand); opacity: .25; }
</style>
</head>
<body>
  <div class="blob-a"></div><div class="blob-b"></div><div class="dots"></div>
  <div class="frame">
    <div class="top">
      <div class="id"><div class="badge">M</div><span class="mono">Matteo Davoigneau</span></div>
      <span class="domain">davoigneau.com</span>
    </div>
    <h1>I build AI and automation that teams actually <span class="swash">use<i></i></span>.</h1>
    <div class="foot"><span class="mono">AI &amp; Software Engineer · Sydney</span></div>
  </div>
  <div class="bars" aria-hidden="true">
    <div class="bar"><span style="width:100%"></span></div>
    <div class="bar"><span style="width:75%"></span></div>
    <div class="bar"><span style="width:60%"></span></div>
    <div class="bar"><span class="est" style="width:60%"></span></div>
    <div class="bar"><span style="width:30%"></span></div>
  </div>
</body>
</html>
